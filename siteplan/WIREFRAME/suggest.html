<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suggest Wireframe</title>
    <link rel="stylesheet" href="wireframe.css">
</head>

<body>
    <div class="browser-window">
        <header>
            <h2>[ Logo ] Popcorn Flicks</h2>
            <div class="nav-links">
                <span>Home</span> <span>Watchlist</span> <span>Suggest</span>
            </div>
        </header>

        <div class="form-container">
            <h2 style="margin-bottom: 20px; text-align: center;">SUGGEST A MOVIE</h2>

            <div class="form-group">
                <label>Movie Title *</label>
                <div class="input-box"></div>
            </div>

            <div class="form-group">
                <label>Runtime (Minutes) *</label>
                <div class="input-box"></div>
            </div>

            <div class="form-group">
                <label>Recommended Mood *</label>
                <div class="input-box" style="display: flex; align-items: center; padding-left: 10px; color: #666;">
                    [ Select Mood v ]
                </div>
            </div>

            <div style="text-align: center; margin-top: 25px;">
                <span class="btn" style="width: 100%;">SUBMIT MOVIE</span>
            </div>
        </div>

        <footer>
            <p>© 2026 - Tamara Moya | Popcorn Flicks | Site Plan </p>
        </footer>
    </div>
</body>

</html>
