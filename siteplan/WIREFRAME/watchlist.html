<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watchlist Wireframe</title>
    <link rel="stylesheet" href="wireframe.css">
</head>

<body>
    <div class="browser-window">
        <header>
            <h2>[ Logo ] Popcorn Flicks</h2>
            <div class="nav-links">
                <span>Home</span> <span>Watchlist</span> <span>Suggest</span>
            </div>
        </header>

        <section class="hero">
            <h1>YOUR SAVED WATCHLIST</h1>
            <p>Your saved choices stored locally in your browser.</p>
        </section>

        <section class="grid">
            <div class="card">
                <div class="img-placeholder">X Image</div>
                <h3>Movie Title</h3>
                <p>Genre | Runtime</p>
                <div style="margin-top: 10px; text-align: center;">
                    <span class="btn">Remove</span>
                </div>
            </div>

                <div class="img-placeholder">X Image</div>
                <h3>Movie Title</h3>
                <p>Genre | Runtime</p>
                <div style="margin-top: 10px; text-align: center;">
                    <span class="btn">Remove</span>
                </div>
            </div>
        </section>

        <footer>
            <p>© 2026 - Tamara Moya | Popcorn Flicks | Site Plan </p>
        </footer>
    </div>

</html>
