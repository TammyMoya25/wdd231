<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popcorn Flicks | Thank You</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>
    <header>
        <div class="logo">
            <h2>🍿 Popcorn Flicks</h2>
        </div>
    </header>

    <main
        style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 50vh; text-align: center; padding: 20px;">
        <h1 style="color: var(--accent-red); margin-bottom: 20px;">THANK YOU!</h1>
        <p style="font-size: 1.2rem; margin-bottom: 10px;">Your movie suggestion was submitted successfully.</p>

        <!-- Recuadro para mostrar los datos enviados (DOM Manipulation) -->
        <div id="results"
            style="background-color: var(--bg-surface); padding: 20px; border-radius: 8px; margin: 20px 0; border: 1px solid var(--border-color); width: 100%; max-width: 400px; text-align: left;">
            <p><strong>Title:</strong> <span id="res-title"></span></p>
            <p><strong>Runtime:</strong> <span id="res-runtime"></span> min</p>
            <p><strong>Mood:</strong> <span id="res-mood"></span></p>
        </div>

        <a href="index.html" class="filter-btn active" style="text-decoration: none; margin-top: 20px;">Back to Home</a>
    </main>

    <script>
        // Leer la URL para mostrar los datos enviados (demostrando manipulación del DOM)
        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('res-title').textContent = urlParams.get('title') || 'N/A';
        document.getElementById('res-runtime').textContent = urlParams.get('runtime') || 'N/A';
        document.getElementById('res-mood').textContent = urlParams.get('mood') || 'N/A';
    </script>
</body>

</html>
