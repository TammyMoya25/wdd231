<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popcorn Flicks | Suggest a Movie</title>
    <meta name="description" content="This page is to suggest a movie to be added to Popcorn Flicks. Let's do it.">
    <meta name="author" content="Tamara Moya">

    <!-- Open Graph Tags for Social Sharing -->
    <meta property="og:title" content="Popcorn Flicks | Movie Recommendations">
    <meta property="og:description" content="Find the perfect movie for your current mood. No endless scrolling.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://tammymoya25.github.io/wdd231/finalproject/images/og-image.webp">">
    <meta property="og:url" content="https://tammymoya25.github.io/wdd231/final/index.html">

    <!-- Favicon -->
    <link rel="icon" href="images/favicon.ico">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/normalize.css">

    <!-- JavaScript (ES Module) -->
    <script type="module" src="scripts/suggest.js"></script>
</head>

<body>
    <header>
        <div class="logo">
            <h2>🍿 Popcorn Flicks</h2>
        </div>
        <button id="menu-btn" aria-label="Toggle navigation menu">&#9776;</button>
        <nav id="nav-menu">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="watchlist.html">Watchlist</a></li>
                <li><a href="suggest.html" class="active">Suggest</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>SUGGEST A MOVIE</h1>
            <p>Know a great movie we should add to our catalog? Let us know!</p>
        </section>

        <!-- Formulario enviado mediante GET a form-response.html -->
        <section class="form-container">
            <form action="form-response.html" method="GET">
                <div class="form-group">
                    <label for="title">Movie Title *</label>
                    <input type="text" id="title" name="title" required placeholder="e.g. The Matrix">
                </div>

                <div class="form-group">
                    <label for="runtime">Runtime (Minutes) *</label>
                    <input type="number" id="runtime" name="runtime" required min="1" placeholder="e.g. 120">
                </div>

                <div class="form-group">
                    <label for="mood">Recommended Mood *</label>
                    <select id="mood" name="mood" required>
                        <option value="" disabled selected>Select a mood...</option>
                        <option value="Mindless Fun">Mindless Fun</option>
                        <option value="Spooky">Spooky</option>
                        <option value="Heartwarming">Heartwarming</option>
                        <option value="Action">Action</option>
                    </select>
                </div>

                <div class="form-group">
                    <button type="submit" class="submit-btn">SUBMIT MOVIE</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="current-year"></span> Popcorn Flicks | Tamara Moya</p>
        <p><a href="site-plan.html">Site Plan</a> | <a href="attributions.html">Attributions</a></p>
    </footer>
</body>

</html>
